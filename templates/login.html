<!DOCTYPE html><html lang="uk"><head><meta charset="UTF-8"><title>Login · Rank Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css"></head><body class="login-body">
<form method="post" class="login-card">
  <h1>⚡ RANK<span>TRACKER</span></h1>
  <input type="password" name="password" placeholder="Admin password" autofocus required>
  {% if err %}<div class="err">{{ err }}</div>{% endif %}
  <button type="submit" class="btn primary">Увійти</button>
</form></body></html>
